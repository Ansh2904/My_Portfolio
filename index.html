    <script>
      window.addEventListener('error', function (e) {
        var errDiv = document.getElementById('client-error-banner');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'client-error-banner';
          errDiv.style = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#ffffff;padding:20px;font-family:monospace;font-size:14px;z-index:9999999;overflow:auto;max-height:50vh;';
          document.body.appendChild(errDiv);
        }
        errDiv.innerHTML = '<strong>⚠️ JavaScript Error:</strong> ' + e.message + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>';
      });
    </script>
